# =============================================================================
# Veradigm — Local Development Docker Compose
# =============================================================================
# Usage:
#   docker compose up -d              (starts all: postgres, fhir, unity, admin)
#   docker compose up -d fhir-mcp     (start only fhir + its dependencies)
#   docker compose down               (stop all)
#
#   Production: use /opt/veradigm/docker-compose.prod.yml on EC2 instead.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database (for Admin Portal)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: veradigm-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=veradigm_admin
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-veradigm2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # FHIR MCP Server - Read Operations (Port 3000)
  # ---------------------------------------------------------------------------
  fhir-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: veradigm-fhir-mcp:local
    container_name: veradigm-fhir-mcp-server
    ports:
      - "${MCP_SERVER_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-sandbox}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - FHIR_BASE_URL_SANDBOX=${FHIR_BASE_URL_SANDBOX}
      - FHIR_BASE_URL_PRODUCTION=${FHIR_BASE_URL_PRODUCTION}
      - AUTH_URL_SANDBOX=${AUTH_URL_SANDBOX}
      - TOKEN_URL_SANDBOX=${TOKEN_URL_SANDBOX}
      - AUTH_URL_PRODUCTION=${AUTH_URL_PRODUCTION}
      - TOKEN_URL_PRODUCTION=${TOKEN_URL_PRODUCTION}
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-3000}
      - MCP_SERVER_HOST=0.0.0.0
      - TOKEN_CACHE_TTL=${TOKEN_CACHE_TTL:-3600}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ADMIN_PORTAL_URL=http://admin-portal:5001
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - MCP_CHANNEL=${MCP_CHANNEL:-API}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('FHIR Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Unity MCP Server - Write Operations (Port 3001)
  # ---------------------------------------------------------------------------
  unity-mcp:
    build:
      context: .
      dockerfile: Dockerfile.unity
      target: production
    image: veradigm-unity-mcp:local
    container_name: veradigm-unity-mcp-server
    ports:
      - "${UNITY_MCP_SERVER_PORT:-3001}:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-sandbox}
      - UNITY_APP_NAME=${UNITY_APP_NAME}
      - UNITY_SVC_USERNAME=${UNITY_SVC_USERNAME}
      - UNITY_SVC_PASSWORD=${UNITY_SVC_PASSWORD}
      - UNITY_EHR_USERNAME=${UNITY_EHR_USERNAME}
      - UNITY_EHR_PASSWORD=${UNITY_EHR_PASSWORD}
      - UNITY_UBIQUITY_ENDPOINT=${UNITY_UBIQUITY_ENDPOINT:-https://open-uny-ubiquity.platform.veradigm.com/UnityService.svc}
      - UNITY_UBIQUITY_ID_PM=${UNITY_UBIQUITY_ID_PM:-VHCP001PM:PMGA02^8^}
      - UNITY_UBIQUITY_ID_EHR=${UNITY_UBIQUITY_ID_EHR:-AHMCP00101:CP00101^1^}
      - UNITY_TOKEN_CACHE_TTL=${UNITY_TOKEN_CACHE_TTL:-1140}
      - UNITY_TOKEN_REFRESH_BUFFER=${UNITY_TOKEN_REFRESH_BUFFER:-60}
      - UNITY_MCP_SERVER_PORT=${UNITY_MCP_SERVER_PORT:-3001}
      - UNITY_MCP_SERVER_HOST=0.0.0.0
      - ADMIN_PORTAL_URL=http://admin-portal:5001
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - MCP_CHANNEL=${MCP_CHANNEL:-API}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Unity Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      fhir-mcp:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Admin Portal (Next.js) - Port 5001
  # ---------------------------------------------------------------------------
  admin-portal:
    build:
      context: ../veradigmai
      dockerfile: Dockerfile
    image: veradigm-admin-portal:local
    container_name: veradigm-admin-portal
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD:-veradigm2026}@postgres:5432/veradigm_admin
      - NEXTAUTH_URL=http://localhost:5001
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@veradigm.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - FHIR_MCP_CONTAINER_NAME=veradigm-fhir-mcp-server
      - UNITY_MCP_CONTAINER_NAME=veradigm-unity-mcp-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      postgres:
        condition: service_healthy
      fhir-mcp:
        condition: service_healthy
      unity-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pgdata:

networks:
  mcp-network:
    driver: bridge
