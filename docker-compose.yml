services:
  # FHIR MCP Server - Read Operations
  veradigm-fhir-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: veradigm-fhir-mcp-server
    ports:
      - "${MCP_SERVER_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-sandbox}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - FHIR_BASE_URL_SANDBOX=${FHIR_BASE_URL_SANDBOX}
      - FHIR_BASE_URL_PRODUCTION=${FHIR_BASE_URL_PRODUCTION}
      - AUTH_URL_SANDBOX=${AUTH_URL_SANDBOX}
      - TOKEN_URL_SANDBOX=${TOKEN_URL_SANDBOX}
      - AUTH_URL_PRODUCTION=${AUTH_URL_PRODUCTION}
      - TOKEN_URL_PRODUCTION=${TOKEN_URL_PRODUCTION}
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-3000}
      - MCP_SERVER_HOST=${MCP_SERVER_HOST:-localhost}
      - TOKEN_CACHE_TTL=${TOKEN_CACHE_TTL:-3600}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Admin Portal (from inside Docker use host.docker.internal to reach host)
      - ADMIN_PORTAL_URL=http://host.docker.internal:5001
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - MCP_CHANNEL=${MCP_CHANNEL:-API}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('FHIR Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Unity MCP Server - Write Operations
  veradigm-unity-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.unity
      target: production
    container_name: veradigm-unity-mcp-server
    ports:
      - "${UNITY_MCP_SERVER_PORT:-3001}:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-sandbox}
      # Unity Application Configuration
      - UNITY_APP_NAME=${UNITY_APP_NAME}
      # Unity Service Credentials (for GetToken)
      - UNITY_SVC_USERNAME=${UNITY_SVC_USERNAME}
      - UNITY_SVC_PASSWORD=${UNITY_SVC_PASSWORD}
      # EHR/PM User Credentials (for GetUserAuthentication)
      - UNITY_EHR_USERNAME=${UNITY_EHR_USERNAME}
      - UNITY_EHR_PASSWORD=${UNITY_EHR_PASSWORD}
      # Unity Endpoints
      - UNITY_UBIQUITY_ENDPOINT=${UNITY_UBIQUITY_ENDPOINT:-https://ubiquityunity.azurewebsites.net/UnityService.svc}
      - UNITY_UBIQUITY_ID_PM=${UNITY_UBIQUITY_ID_PM:-VHCP001PM:PMGA02^8^}
      - UNITY_UBIQUITY_ID_EHR=${UNITY_UBIQUITY_ID_EHR:-AHMCP00101:CP00101^1^}
      # Token Configuration
      - UNITY_TOKEN_CACHE_TTL=${UNITY_TOKEN_CACHE_TTL:-1140}
      - UNITY_TOKEN_REFRESH_BUFFER=${UNITY_TOKEN_REFRESH_BUFFER:-60}
      # Server Configuration
      - UNITY_MCP_SERVER_PORT=${UNITY_MCP_SERVER_PORT:-3001}
      - UNITY_MCP_SERVER_HOST=${UNITY_MCP_SERVER_HOST:-localhost}
      # Admin Portal (from inside Docker use host.docker.internal to reach host)
      - ADMIN_PORTAL_URL=${ADMIN_PORTAL_URL:-http://host.docker.internal:5001}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - MCP_CHANNEL=${MCP_CHANNEL:-API}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Unity Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - veradigm-fhir-mcp-server

networks:
  mcp-network:
    driver: bridge
