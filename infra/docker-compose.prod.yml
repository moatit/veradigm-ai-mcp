# =============================================================================
# Veradigm Production Docker Compose
# =============================================================================
# Usage:
#   1. Set AWS_ACCOUNT_ID and AWS_REGION in .env.prod (or export them)
#   2. Run: ./scripts/fetch-secrets.sh        (pulls secrets from SSM -> .env.prod)
#   3. Run: docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: veradigm-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=veradigm_admin
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-veradigm2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # FHIR MCP Server (Read Operations) - Port 3000
  # ---------------------------------------------------------------------------
  fhir-mcp:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/veradigm-fhir-mcp:${IMAGE_TAG:-latest}
    container_name: veradigm-fhir-mcp-server
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=${NODE_ENV:-sandbox}
      - MCP_SERVER_PORT=3000
      - MCP_SERVER_HOST=0.0.0.0
      - ADMIN_PORTAL_URL=http://admin-portal:5001
      - MCP_CHANNEL=${MCP_CHANNEL:-API}
    volumes:
      - fhir-logs:/app/logs
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('FHIR Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Unity MCP Server (Write Operations) - Port 3001
  # ---------------------------------------------------------------------------
  unity-mcp:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/veradigm-unity-mcp:${IMAGE_TAG:-latest}
    container_name: veradigm-unity-mcp-server
    ports:
      - "3001:3001"
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=${NODE_ENV:-sandbox}
      - UNITY_MCP_SERVER_PORT=3001
      - UNITY_MCP_SERVER_HOST=0.0.0.0
      - ADMIN_PORTAL_URL=http://admin-portal:5001
      - MCP_CHANNEL=${MCP_CHANNEL:-API}
    volumes:
      - unity-logs:/app/logs
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      fhir-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Unity Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Admin Portal (Next.js) - Port 5001
  # ---------------------------------------------------------------------------
  admin-portal:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/veradigm-admin-portal:${IMAGE_TAG:-latest}
    container_name: veradigm-admin-portal
    ports:
      - "5001:5001"
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - PORT=5001
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD:-veradigm2026}@postgres:5432/veradigm_admin
      - FHIR_MCP_CONTAINER_NAME=veradigm-fhir-mcp-server
      - UNITY_MCP_CONTAINER_NAME=veradigm-unity-mcp-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      postgres:
        condition: service_healthy
      fhir-mcp:
        condition: service_healthy
      unity-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  fhir-logs:
  unity-logs:

networks:
  mcp-network:
    driver: bridge
