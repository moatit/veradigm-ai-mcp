# =============================================================================
# Deploy FHIR & Unity MCP Servers to AWS
# =============================================================================
# Triggers on push to main. Builds Docker images, pushes to ECR, deploys to EC2.
#
# Required GitHub repository settings:
#   Secrets:
#     AWS_ACCESS_KEY_ID      - IAM user access key
#     AWS_SECRET_ACCESS_KEY  - IAM user secret key
#     EC2_INSTANCE_ID        - EC2 instance ID (from terraform output)
#   Variables:
#     AWS_REGION             - e.g. us-east-1
#     AWS_ACCOUNT_ID         - AWS account number
# =============================================================================

name: Deploy MCP Servers

on:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - '*.md'
      - 'postman/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------------------------
      # Checkout & AWS Auth
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------------------------------
      # Build & Push FHIR MCP Server
      # -----------------------------------------------------------------------
      - name: Build FHIR MCP image
        run: |
          docker build \
            -f Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/veradigm-fhir-mcp:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/veradigm-fhir-mcp:latest \
            .

      - name: Push FHIR MCP image
        run: |
          docker push ${{ env.ECR_REGISTRY }}/veradigm-fhir-mcp:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/veradigm-fhir-mcp:latest

      # -----------------------------------------------------------------------
      # Build & Push Unity MCP Server
      # -----------------------------------------------------------------------
      - name: Build Unity MCP image
        run: |
          docker build \
            -f Dockerfile.unity \
            -t ${{ env.ECR_REGISTRY }}/veradigm-unity-mcp:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/veradigm-unity-mcp:latest \
            .

      - name: Push Unity MCP image
        run: |
          docker push ${{ env.ECR_REGISTRY }}/veradigm-unity-mcp:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/veradigm-unity-mcp:latest

      # -----------------------------------------------------------------------
      # Deploy to EC2 via SSM
      # -----------------------------------------------------------------------
      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "cd /opt/veradigm",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}",
              "/opt/veradigm/fetch-secrets.sh",
              "docker compose -f docker-compose.prod.yml pull fhir-mcp unity-mcp",
              "docker compose -f docker-compose.prod.yml up -d --no-deps fhir-mcp unity-mcp"
            ]' \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: Status = $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
          echo "Deployment timed out"
          exit 1
