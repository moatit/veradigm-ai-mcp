# Drawbridge document intake, SHADOW MODE, on MOATiT's dedicated IKI fax server in MOATiT's data center.
#
#   cd deploy/datacenter
#   cp .env.example .env            # fill in (never commit .env)
#   docker compose up -d            # images built or loaded beforehand (README: "Images")
#
# Nothing is ever filed: INTAKE_MODE=shadow, and the server only runs Veradigm read actions
# (SearchPatients, GetDocumentType, GetDocuments, GetDocumentsByDocumentType, GetDocumentImage).
#
# Networks (no internet, except one named host):
#   intake     internal: intake, ocr, gateway, unity-egress. No route out.
#   fax-link   internal: intake <-> the MOATiT Fax API container (webhook in, job + download out).
#   edge       the gateway's published HTTPS port for staff browsers. Nothing else.
#   egress     unity-egress only: TCP 443 to VERADIGM_UNITY_HOST and nothing else (TLS SNI checked),
#              and only when the "veradigm" profile is on (live read-only search and the staff
#              filing observer). Without it the stack has no outbound path at all.
# Fixed subnets so the host firewall can pin them too (README: "Outbound").
name: drawbridge-shadow

services:
  intake:
    build:
      context: ../..
      dockerfile: Dockerfile.unity
    image: drawbridge-intake:${DRAWBRIDGE_TAG:-shadow}
    command: ["node", "dist/platform/shadow-server.js"]
    env_file: .env
    environment:
      - NODE_ENV=production
      - INTAKE_MODE=shadow
      - INTAKE_FILING=off
      - INTAKE_SHADOW_PORT=3001
      - CALL_RECORDS_DIR=/app/data
      - INTAKE_DROP_DIR=/app/data/intake/inbox
      # INTAKE_WATCH_DIRS (the Express Lab folder at /mnt/express-lab) is set in .env: leave it empty when the
      # shadow week reads the Veradigm EHR queue instead (INTAKE_QUEUE_SOURCE=on; one source per document).
      - INTAKE_OCR_URL=http://ocr:8090
      - DRAWBRIDGE_USERS_FILE=/run/drawbridge/users/users
    user: "1001:1001"
    volumes:
      # Everything Drawbridge keeps (items, copies of the documents, reports, audit). On the encrypted volume.
      - ${DATA_DIR:?set DATA_DIR in .env}:/app/data
      # Express Lab results as they land, and the archive of old faxes: read-only, never changed.
      - ${EXPRESS_LAB_DIR:?set EXPRESS_LAB_DIR in .env}:/mnt/express-lab:ro
      - ${OLD_FAX_DIR:?set OLD_FAX_DIR in .env}:/mnt/old-faxes:ro
      # Optional lists (patient list for an early start, category list) and the staff logins.
      - ./lists:/run/drawbridge/lists:ro
      - ./users:/run/drawbridge/users:ro
    # The Veradigm Unity hostname resolves to the egress forwarder, the only way out.
    extra_hosts:
      - "${VERADIGM_UNITY_HOST:-veradigm-unity.invalid}:${EGRESS_IP:-172.30.57.10}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    restart: unless-stopped
    networks:
      intake: {}
      fax-link:
        aliases: [drawbridge-intake]

  # Tesseract 5 OCR (deploy/ocr). No ports, no outbound path.
  ocr:
    build:
      context: ../ocr
    image: drawbridge-intake-ocr:${DRAWBRIDGE_TAG:-shadow}
    environment:
      - OCR_CONCURRENCY=${OCR_CONCURRENCY:-2}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [intake]

  # Staff screens over HTTPS (the session cookie is Secure). /app and nothing else.
  gateway:
    image: nginx:1.27.5-alpine
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    depends_on: [intake]
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
    networks: [intake, edge]

  # The one outbound path: TLS passthrough to the Veradigm Unity host (SNI must equal it), for the
  # read-only patient search and the staff filing observer. Off unless COMPOSE_PROFILES=veradigm.
  unity-egress:
    image: nginx:1.27.5-alpine
    profiles: [veradigm]
    environment:
      - VERADIGM_UNITY_HOST=${VERADIGM_UNITY_HOST:?set VERADIGM_UNITY_HOST for the veradigm profile}
      - EGRESS_DNS=${EGRESS_DNS:-127.0.0.11}
      - NGINX_ENVSUBST_TEMPLATE_DIR=/etc/nginx/egress-templates
      - NGINX_ENVSUBST_TEMPLATE_SUFFIX=.template
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    volumes:
      - ./unity-egress.conf.template:/etc/nginx/egress-templates/nginx.conf.template:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks:
      intake:
        ipv4_address: ${EGRESS_IP:-172.30.57.10}
      egress: {}

networks:
  intake:
    name: drawbridge-shadow-intake
    internal: true
    ipam:
      config:
        - subnet: ${INTAKE_SUBNET:-172.30.57.0/24}
  fax-link:
    # The MOATiT Fax API service joins this network from its own compose file (README: "MOATiT Fax").
    name: drawbridge-fax-link
    internal: true
    ipam:
      config:
        - subnet: ${FAX_LINK_SUBNET:-172.30.56.0/24}
  edge:
    name: drawbridge-shadow-edge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.58.0/24}
  egress:
    name: drawbridge-shadow-egress
    ipam:
      config:
        - subnet: ${EGRESS_SUBNET:-172.30.59.0/24}
