# Drawbridge shadow intake: staff screens over HTTPS, inside MOATiT's data center only.
# Certificate and key in ./tls (server.crt, server.key): from MOATiT's internal CA, or self-signed (README).
# Only /app is served. The MOATiT Fax webhook reaches the intake container on the internal
# fax-link network, not through here.
log_format drawbridge '$time_iso8601 $remote_addr $request_method $uri $status $body_bytes_sent';

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;

    # Path only: no query strings in the log.
    access_log /dev/stdout drawbridge;

    # Limit who may reach the screens (the staff subnets of IKI and MOATiT). Edit, then reload.
    # allow 10.20.0.0/16;
    # deny all;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    location = / { return 302 /app/intake; }
    location = /app/intake/upload { client_max_body_size 40m; proxy_pass http://intake:3001; }
    location /app { proxy_pass http://intake:3001; }
    location / { return 404; }
}
