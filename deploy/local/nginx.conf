# Drawbridge dev gateway. TLS is terminated by Cloudflare; this listens on 127.0.0.1:8095 only.
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    location = /health { default_type application/json; return 200 '{"status":"ok","service":"drawbridge-gateway"}'; }
    location = / { return 302 /app; }

    # Veradigm EHR (FHIR, read only). Only the agent endpoints are public; the
    # FHIR server's REST test routes (/api/patient/..., /test/...) stay internal.
    location = /fhir/            { proxy_pass http://fhir:3000/; }
    location = /fhir/api/retell  { proxy_pass http://fhir:3000/api/retell; }
    location = /fhir/health      { proxy_pass http://fhir:3000/health; }
    location /fhir/              { return 404; }

    # Veradigm PM/EHR (Unity) + Drawbridge platform
    location /unity/ { proxy_pass http://unity:3001/; }
    location /app    { proxy_pass http://unity:3001; }
    location /api/   { proxy_pass http://unity:3001; }
}
