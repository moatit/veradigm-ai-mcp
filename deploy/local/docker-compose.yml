# Drawbridge local dev/test platform (Docker Desktop on Ali's workstation)
#
#   cd deploy/local
#   cp .env.example .env        # fill in sandbox credentials (never commit .env)
#   docker compose up -d --build
#
# Gateway: http://127.0.0.1:8095  (public: https://drawbridge.moatit.dev via the host Cloudflare tunnel)
#   /app                staff app (login)            -> unity
#   /unity/api/retell   Retell custom functions      -> unity
#   /fhir/api/retell    Retell custom functions      -> fhir
#   /unity/, /fhir/     MCP JSON-RPC                 -> unity / fhir
#   /webhooks/retell    Retell call events (verified) -> unity
#
# Both services share the drawbridge-data volume at /app/data: call records, calls index and the
# audit log (<dir>/audit/YYYY-MM-DD.jsonl).
name: drawbridge-dev

services:
  fhir:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: drawbridge-dev-fhir
    env_file: .env
    environment:
      - NODE_ENV=sandbox
      - MCP_SERVER_PORT=3000
      - MCP_SERVER_HOST=0.0.0.0
      # Veradigm FHIR R4 sandbox (practice CP00101, same as the Unity EHR sandbox), system app "MVA"
      - CLIENT_ID=${VERADIGM_FHIR_CLIENT_ID}
      - FHIR_BASE_URL_SANDBOX=https://fhir.fhirpoint.open.allscripts.com/fhirroute/fhir/CP00101
      - AUTH_URL_SANDBOX=https://fhir.fhirpoint.open.allscripts.com/fhirroute/authorizationV2/CP00101/connect/authorize
      - TOKEN_URL_SANDBOX=https://fhir.fhirpoint.open.allscripts.com/fhirroute/authorizationV2/CP00101/connect/token
      - FHIR_AUTH_MODE=${FHIR_AUTH_MODE:-client_secret}
      - FHIR_JWT_PRIVATE_KEY_PATH=/run/drawbridge/fhir-jwt-private.pem
      - FHIR_JWT_KID=drawbridge-dev-2026-10-09-rs256
      - FHIR_JWT_ALG=RS256
      - ADMIN_PORTAL_URL=http://admin:5001
      - MCP_CHANNEL=RETELL
      - CALL_RECORDS_DIR=/app/data
      - CLINIC_TIMEZONE=America/Boise
    volumes:
      - drawbridge-data:/app/data
      - ./secrets/fhir-jwt-private.pem:/run/drawbridge/fhir-jwt-private.pem:ro
    restart: unless-stopped
    networks: [drawbridge]

  unity:
    build:
      context: ../..
      dockerfile: Dockerfile.unity
    image: drawbridge-dev-unity
    env_file: .env
    environment:
      - NODE_ENV=sandbox
      - UNITY_PORT=3001
      - CALL_RECORDS_DIR=/app/data
      - CLINIC_TIMEZONE=America/Boise
      - ADMIN_PORTAL_URL=http://admin:5001
      - MCP_CHANNEL=RETELL
      # Document intake: local OCR for files without a text layer (the ocr service below)
      - INTAKE_OCR_URL=http://ocr:8090
      # Voice harness (docs/drawbridge/VOICE_HARNESS.md): off unless VOICE_ENABLED=on in .env. Listens on the
      # internal "voice" network only (port 3010, not published, not proxied by nginx).
      - VOICE_HARNESS_PORT=3010
    volumes:
      - drawbridge-data:/app/data
      # Document intake drop folder (PHI; git-ignored): put files in ./intake/inbox
      - ./intake:/app/intake
      # Named staff logins (npm run staff:user); used when .env sets DRAWBRIDGE_USERS_FILE=/run/drawbridge/drawbridge-users
      - ./secrets:/run/drawbridge:ro
    restart: unless-stopped
    networks: [drawbridge, voice]

  # ---- Intake OCR (Tesseract 5, deploy/ocr): documents never leave this network ----
  # No host ports: only unity reaches it, at http://ocr:8090.
  ocr:
    build:
      context: ../ocr
    image: drawbridge-intake-ocr
    environment:
      - OCR_CONCURRENCY=2
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [drawbridge]

  # ---- Drawbridge Admin (moatit/veradigmai): call reports, monitoring, client API keys ----
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=drawbridge_admin
      - POSTGRES_USER=drawbridge
      - POSTGRES_PASSWORD=${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD in .env}
    volumes:
      - admin-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawbridge -d drawbridge_admin"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [drawbridge]

  # One-shot: create/alter tables and seed the admin user + clients (idempotent)
  admin-init:
    build:
      context: ${ADMIN_PORTAL_SRC:-../../../veradigmai-repo}
      target: builder
    image: drawbridge-dev-admin-builder
    command: ["sh", "-c", "npx tsx scripts/sync-db.ts && npx tsx scripts/seed-db.ts"]
    environment:
      - DATABASE_URL=postgres://drawbridge:${ADMIN_DB_PASSWORD}@postgres:5432/drawbridge_admin
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SEED_RETELL_API_KEY=${ADMIN_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [drawbridge]

  admin:
    build:
      context: ${ADMIN_PORTAL_SRC:-../../../veradigmai-repo}
    image: drawbridge-dev-admin
    environment:
      - DATABASE_URL=postgres://drawbridge:${ADMIN_DB_PASSWORD}@postgres:5432/drawbridge_admin
      - NEXTAUTH_URL=${ADMIN_PUBLIC_URL:-http://127.0.0.1:8096}
      - NEXTAUTH_SECRET=${ADMIN_NEXTAUTH_SECRET:?set ADMIN_NEXTAUTH_SECRET in .env}
      # No Docker socket: the portal's container controls would reach every container on this machine.
      - DOCKER_SOCKET_PATH=/nonexistent/docker.sock
    ports:
      - "127.0.0.1:8096:5001"
    depends_on:
      admin-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [drawbridge]

  # ---- Voice gateway (docs/drawbridge/VOICE_HARNESS.md): Drawbridge registers as a PBX extension ----
  # Opt-in: docker compose --profile voice up -d voice-gw
  # SIP user agent + media only (TLS signalling, SRTP when offered, G.711, REFER). No patient logic: tools,
  # identity checks, audit and transcripts stay in the unity process (port 3010 on the internal "voice"
  # network, never published, nginx never proxies it). No host ports. Only the variables it needs are passed
  # (no env_file: it never sees the Veradigm or model keys).
  voice-gw:
    profiles: ["voice"]
    build:
      context: ../voice-gw
    image: drawbridge-dev-voice-gw
    environment:
      - SIP_REALM=${SIP_REALM:?set SIP_REALM in .env}
      - SIP_USERNAME=${SIP_USERNAME:?set SIP_USERNAME in .env}
      - SIP_PASSWORD=${SIP_PASSWORD:?set SIP_PASSWORD in .env}
      - SIP_EXPIRES=${SIP_EXPIRES:-300}
      - VOICE_GW_SECRET=${VOICE_GW_SECRET:-}
      - VOICE_GW_MODE=${VOICE_GW_MODE:-harness}
      # Titan's TLS proxies (the SRV records only list UDP 7000; TLS 5061 answers on the same hosts). All of them
      # present one GoDaddy certificate for kam001.phl.wlcomm.net: verified against that name, never skipped.
      - VOICE_SIP_PROXIES=${VOICE_SIP_PROXIES:-kam001.z1.grr.voipproxy.net:5061,kam002.z1.grr.voipproxy.net:5061,kam002.z1.phl.voipproxy.net:5061}
      - VOICE_SIP_TLS_SERVER_NAME=${VOICE_SIP_TLS_SERVER_NAME:-kam001.phl.wlcomm.net}
      # srtp-required (default, patient calls) | srtp-preferred-synthetic-only (test calls, synthetic patients only)
      - VOICE_MEDIA_ENCRYPTION=${VOICE_MEDIA_ENCRYPTION:-srtp-required}
      - VOICE_STUN_SERVER=${VOICE_STUN_SERVER:-stun.cloudflare.com:3478}
      - VOICE_PUBLIC_IP=${VOICE_PUBLIC_IP:-}
      - VOICE_RTP_PORT_MIN=20000
      - VOICE_RTP_PORT_MAX=20199
      - VOICE_MAX_CALLS=${VOICE_MAX_CALLS:-4}
      - VOICE_HARNESS_URL=ws://unity:3010/voice-gw
      - VOICE_GW_FALLBACK_TARGET=${VOICE_GW_FALLBACK_TARGET:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [voice, voice-egress]

  gateway:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/drawbridge-public:ro
    ports:
      - "127.0.0.1:8095:80"
    depends_on: [fhir, unity]
    restart: unless-stopped
    networks: [drawbridge]

volumes:
  drawbridge-data:
  admin-db:

networks:
  drawbridge:
  # unity <-> voice-gw only (call audio and control). internal: no route off the host.
  voice:
    internal: true
  # voice-gw's way out to the PBX (SIP over TLS, RTP/SRTP)
  voice-egress:
